<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magic Spot</title>
<meta name="description" content="Free and city-run parking in Miami, sorted by how far you'll walk to where you're going.">
<meta name="theme-color" content="#EEF5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1A22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Magic Spot">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Josefin+Sans:wght@600;700&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage">
  <section class="mapwrap" aria-label="Map">
    <div id="map"></div>
    <div class="mapbtns">
      <button class="mapbtn" id="btn-locate" type="button" aria-label="Show where I am">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 20l7-3.5 7 3.5z"/></svg>
      </button>
      <button class="mapbtn drive-btn" id="btn-drive" type="button" aria-label="Drive mode: big buttons for a phone in a car dock">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17h14v-4.5L17 7H7l-2 5.5z"/><path d="M5 17v2M19 17v2M5 12.5h14"/><circle cx="8" cy="15" r=".6"/><circle cx="16" cy="15" r=".6"/></svg>
        <span>Drive</span>
      </button>
    </div>
    <div class="peek" id="peek" hidden></div>
  </section>

  <div class="drawer" id="drawer">
  <header class="brand" id="brand">
    <button type="button" class="handle" id="handle" aria-controls="panel" aria-expanded="true" aria-label="Hide the list"></button>
    <span class="wordmark">Magic Spot</span>
    <span class="tagline"><span>Free &amp; city parking</span> <span>Miami</span></span>
    <span class="clock" id="clock" hidden></span>
  </header>

  <main class="panel" id="panel">
    <section class="view" data-view="find">
      <div class="filters">
        <div class="search" role="combobox" aria-expanded="false" aria-owns="suggest" aria-haspopup="listbox">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <input id="q" type="search" placeholder="Where are you going?" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"
            aria-label="Where are you going? Search a place or a car park" aria-autocomplete="list" aria-controls="suggest">
          <button type="button" class="clear" id="q-clear" aria-label="Clear" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
          <ul class="suggest" id="suggest" role="listbox" hidden></ul>
        </div>
        <div class="kinds" role="group" aria-label="Show only">
          <button type="button" class="chip k-garage" data-kind="garage" aria-pressed="false"><i class="dot"></i>Garage</button>
          <button type="button" class="chip k-lot" data-kind="lot" aria-pressed="false"><i class="dot"></i>Lot</button>
          <button type="button" class="chip k-ride" data-kind="ride" aria-pressed="false"><i class="dot"></i>Park &amp; ride</button>
        </div>
      </div>
      <div id="dest"></div>
      <ol class="list" id="list"></ol>
      <p class="empty" id="list-empty" hidden>No parking matches those filters.</p>
      <div id="only-wrap"></div>
      <p class="list-foot"><button type="button" class="link quiet" data-about>About this app</button></p>
    </section>

    <section class="view" data-view="tips" hidden>
      <div id="tips"></div>
    </section>
  </main>
  </div>
  </div>

  <!-- Drive mode: for a phone in a car dock. Glance and tap; navigation hands off to a maps app. -->
  <section class="drive" id="drive" aria-label="Drive mode" hidden>
    <div class="drive-top">
      <button type="button" class="drive-exit" id="drive-exit" aria-label="Leave Drive mode">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="drive-title" id="drive-title"></div>
      <button type="button" class="drive-nav" id="drive-nav" aria-label="Navigation app"></button>
    </div>
    <div class="drive-body" id="drive-body"></div>
  </section>

  <nav class="tabs" aria-label="Sections">
    <button type="button" data-tab="find" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M10 16V8h3a2.5 2.5 0 0 1 0 5h-3"/></svg>
      <span>Find parking</span>
    </button>
    <button type="button" data-tab="tips">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg>
      <span>Tips</span>
    </button>
  </nav>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="grab" aria-hidden="true"></div>
    <button type="button" class="close" id="sheet-close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="sheet-actions" id="sheet-actions"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
